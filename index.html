<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100b24">
  <title>Маған жаз — @ayka_net</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      background: #100b24;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 15% 20%, #893eff70, transparent 55%),
        radial-gradient(ellipse at 90% 75%, #ff438e50, transparent 50%),
        radial-gradient(ellipse at 85% 10%, #298aff45, transparent 45%),
        linear-gradient(155deg, #160d30, #090714);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: radial-gradient(#ffffff35 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.3;
      mask-image: linear-gradient(#000, transparent);
    }

    main {
      width: 100%;
      max-width: 620px;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border: 1px solid #ffffff30;
      border-radius: 24px;
      background: linear-gradient(135deg, #ffffff20, #ffffff08);
      box-shadow: 0 12px 50px #9c65ff25;
    }

    .icon svg {
      width: 38px;
      height: 38px;
      fill: #fff;
    }

    .username {
      margin: 0 0 32px;
      color: #d0bee9;
      font-size: 16px;
      letter-spacing: 2px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 62px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1.5px;
      text-wrap: balance;
    }

    h1 span {
      display: block;
      margin-top: 8px;
      color: #e6b6ff;
    }

    .arrow {
      display: block;
      width: 44px;
      height: 64px;
      margin: 26px auto;
      color: #e6b6ff;
      animation: point 1.6s ease-in-out infinite;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 390px;
      min-height: 120px;
      margin: 0 auto;
      padding: 26px;
      border: 1px solid #ffffff90;
      border-radius: 18px;
      background: linear-gradient(120deg, #fff, #f3d8ff 55%, #d9ccff);
      box-shadow:
        0 0 45px #c374ff40,
        0 18px 55px #0005,
        inset 0 2px 0 #fff;
      color: #29143e;
      font-size: clamp(38px, 9vw, 52px);
      font-weight: 900;
      letter-spacing: 5px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .button:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 65px #c374ff65, 0 22px 60px #0006;
    }

    .button:active {
      transform: scale(0.97);
    }

    .button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 7px;
    }

    .hint {
      margin: 24px 0 0;
      color: #c3b4d8;
      font-size: 14px;
    }

    @keyframes point {
      0%, 100% { transform: translateY(-5px); }
      50% { transform: translateY(7px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .arrow { animation: none; }
      .button { transition: none; }
    }
  </style>
</head>

<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M21.8 3.4 18.5 20c-.2 1.2-.9 1.5-1.9.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L5.8 13.5.9 12c-1.1-.3-1.1-1.1.2-1.6L20.3 3c.9-.3 1.7.2 1.5.4Z"/>
      </svg>
    </div>

    <p class="username">@ayka_net</p>

    <h1>
      Маған жазу үшін
      <span>осында бас</span>
    </h1>

    <svg class="arrow" viewBox="0 0 44 64" fill="none" aria-hidden="true">
      <path
        d="M22 5V53M8 39L22 54L36 39"
        stroke="currentColor"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    <a
      class="button"
      href="https://t.me/ayka_net"
      aria-label="Telegram арқылы маған жазу: @ayka_net"
    >БАС</a>

    <p class="hint">Telegram-ға өту үшін батырманы бас ✨</p>
  </main>
</body>
</html>
